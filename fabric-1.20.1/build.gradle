buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.fabricmc', name: 'fabric-loom', version: '1.1.9'
    }
}
apply plugin: 'fabric-loom'
apply plugin: 'scala'
apply plugin: 'maven-publish'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = parent.project.archives_base_name
version = parent.version + "+fabric-" + project.minecraft_version
group = parent.group

configurations {
    implementation.extendsFrom(shadow)
}

// `fabric-language-scala:1.1.0+` brings scala-compiler 2.13.6/8, which crashes compiling
// 1.20.1 class files via scala/bug#12783 (MethodParameters parser, fixed in 2.13.9+). Force
// scala to 2.13.12. Gradle 7.3.1's default Zinc is built for scala 2.12 and its `afterResolve`
// safeguard rejects any 2.13.x scala-library — bypass it by adding an explicit `zinc` dep
// below, which prevents `defaultDependencies` (and the nested safeguard) from registering.
// Pinned to zinc_2.12:1.3.5 (matches Gradle 7.3.1's bundled default): Zinc 1.4+ migrated
// AnalyzingCompiler.compileSources from File to Path and Gradle 7.3.1's plugin code still
// calls the old File-based signature, so any newer Zinc gives NoSuchMethodError at compile.
configurations.all {
    resolutionStrategy.force(
        'org.scala-lang:scala-compiler:2.13.12',
        'org.scala-lang:scala-library:2.13.12',
        'org.scala-lang:scala-reflect:2.13.12'
    )
}

dependencies {
    zinc 'org.scala-sbt:zinc_2.12:1.3.5'

    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "net.fabricmc:fabric-language-scala:1.1.0+"

    shadow "io.circe:circe-parser_2.13:0.14.2"
    shadow "io.circe:circe-generic_2.13:0.14.2"
    shadow "io.circe:circe-generic-extras_2.13:0.14.1"
    shadow "io.circe:circe-config_2.13:0.8.0"

    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
    from {
        configurations.shadow.collect { file ->
            [
                    "scala-library",
            ].any { file.toString().contains(it) } ? null : file.isDirectory() ? file : zipTree(file)
        }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            // add all the jars that should be included when publishing to maven
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }

    // select the repositories you want to publish to
    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}
