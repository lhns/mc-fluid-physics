buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    dependencies {
        classpath 'de.lolhens:java-mixin-stubber:0.0.2'
    }
}

plugins {
    id 'net.neoforged.moddev' version '2.0.91'
    // de.lhns.mcdp is declared in build-1.21.1.gradle's plugins{} block (with `apply false`)
    // so the plugin classloader is shared with :fabric-1.21.1 — re-applied here without version.
    id 'de.lhns.mcdp'
    id 'scala'
    id 'maven-publish'
}

archivesBaseName = parent.project.archives_base_name
version = parent.version + "+neoforge-${project.minecraft_version}"
group = parent.group

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

// Pull in shared sources from common-1.21.1. All mixins + Scala co-live under src/main/scala/
// so scalac does joint compilation. The platform module's own java.srcDir is used for the
// mixinstub output only (see below).
sourceSets.main.scala.srcDirs += project(':common-1.21.1').file('src/main/scala')
sourceSets.main.resources.srcDirs += project(':common-1.21.1').file('src/main/resources')

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    // Required for de.lhns.mcdp:mcdp-neoforge — published as a shadow jar to mavenLocal by
    // mc-scala. Workflow before any runClient / build:
    //   ../mc-scala/gradlew :neoforge:publishToMavenLocal
    mavenLocal()
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

neoForge {
    version = project.neoforge_version
    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft
    }
    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', 'fluidphysics'
        }
        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', 'fluidphysics'
        }
        data {
            data()
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'fluidphysics'
        }
    }
    mods {
        fluidphysics {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // mcdp NeoForge runtime adapter — replaces Scalable Cat's Force. Discovers @Mod-annotated
    // classes via ModFileScanData.getAnnotatedBy(Mod.class) like vanilla javafml, and matches
    // FML's (IEventBus) constructor signature directly, so FluidPhysicsNeoForge stays unchanged.
    implementation "de.lhns.mcdp:mcdp-neoforge:${project.mcdp_version}"

    // Scala stdlib + circe + cats go through the per-mod URLClassLoader served by mcdp, not
    // the platform classpath. mcdepImplementation is opt-in: declared here, the plugin emits
    // these into META-INF/mcdepprovider.toml and auto-subtracts platform-provided artifacts.
    mcdepImplementation "org.scala-lang:scala3-library_3:${project.scala3_version}"
    mcdepImplementation "io.circe:circe-parser_3:${project.circe_version}"
    mcdepImplementation "io.circe:circe-generic_3:${project.circe_version}"
    mcdepImplementation "io.circe:circe-generic-extras_3:${project.circe_extras_version}"
    mcdepImplementation "io.circe:circe-config_3:${project.circe_config_version}"
    mcdepImplementation "org.typelevel:cats-core_3:${project.cats_version}"

    // Intentionally no Mixin annotation processor on NeoForge: runtime is Mojmap-native so no refmap
    // is needed, and the AP would otherwise demand obfuscation mappings that don't exist.
    // Validation still happens on the Fabric + common modules (which DO run the AP).

    // Testing (Tier 1 — JUnit 5)
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mcdepprovider {
    lang.set('scala')
}

tasks.named('test') {
    useJUnitPlatform()
}

// java-mixin-stubber
def mixinstubsDir = file("$compileJava.temporaryDir/mixinstubs")
sourceSets.main.java.srcDirs += mixinstubsDir

task mixinstubs {
    doLast {
        delete(mixinstubsDir)
        de.lolhens.jstubber.Stubber.MIXIN.stubDirectory(
            project(':common-1.21.1').file('src/main/scala').toPath(),
            mixinstubsDir.toPath()
        )
    }
}
compileJava.dependsOn(mixinstubs)
compileJava.doLast {
    delete(compileJava.destinationDirectory)
    delete(mixinstubsDir)
}

compileScala.doFirst {
    compileScala.options.compilerArgs += compileJava.options.compilerArgs
}

// Note: no SpongePowered MixinGradle plugin on NeoForge 1.20.5+ — the runtime is Mojmap-native so
// no refmap is needed, and ModDevGradle picks up fluidphysics.mixins.json via the [[mixins]] entry
// in neoforge.mods.toml. The annotation processor below still validates targets at compile time.

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ScalaCompile) {
    scalaCompileOptions.encoding = 'UTF-8'
    scalaCompileOptions.additionalParameters = ['-release', '21']
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : project.name,
            'Specification-Vendor'   : parent.project.mod_author,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : "${version}",
            'Implementation-Vendor'  : parent.project.mod_author,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'           : 'fluidphysics.mixins.json',
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        // publish locally if desired
    }
}
