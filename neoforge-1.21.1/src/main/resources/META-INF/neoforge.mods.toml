modLoader = "mcdepprovider"
loaderVersion = "[1,)"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/LolHens/mc-fluid-physics/issues"

[[mods]]
modId = "fluidphysics"
version = "${version}"
displayName = "Fluid Physics"
displayURL = "https://github.com/LolHens/mc-fluid-physics"
logoFile = "icon.png"
authors = "LolHens"
description = '''
This mod blends together vanilla fluid mechanics with something a little more realistic plus some small additions.
'''

[[mixins]]
config = "fluidphysics.mixins.json"

[[dependencies.fluidphysics]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.fluidphysics]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# mcdp is declared via `modLoader = "mcdepprovider"` at the top — that triggers FML's
# language-provider presence check. mcdp registers as FMLModType=LIBRARY without a mod id,
# so a `[[dependencies]]` entry against it would fail with `Actual version: '[MISSING]'`.
