# Minecraft / NeoForge
minecraft_version=1.21.1
neoforge_version=21.1.77

# Mappings (Parchment layered over Mojmap)
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Scala + language provider
scala3_version=3.5.2
# SCF loader for NeoForge 21.1.x / Minecraft 1.21.1. Follows the Kotori316/SLP canonical
# integration (see example/1.21.1-neoforge at https://github.com/Kotori316/SLP). The
# `-with-library` classifier ships scala2 + scala3 + cats merged flat into a single jar with one
# JPMS module name (`kotori_scala`), avoiding the jar-in-jar JPMS-conflict that bites the
# `-jar-jar` classifier. 3.5.0-build-1 is the oldest 1.21.1-compatible SCF; later builds (3.6.x,
# 3.7.x) add code paths that require NeoForge APIs not present in 21.1.77 (e.g.
# `FMLLoader.getCurrent()`).
scf_neoforge_version=3.5.0-build-1

# circe
circe_version=0.14.10
circe_extras_version=0.14.5-RC1
circe_config_version=0.10.2

# Testing
junit_version=5.10.3
