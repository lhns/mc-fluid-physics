# Two-wrapper build: legacy modules (1.15.2-1.18.2) use Gradle 7.3.1 + Java 17 via the root
# ./gradlew, while the 1.21.1 modules use Gradle 8.10.2 + Java 21 via ./gradlew-1.21.1 and
# settings-1.21.1.gradle. ForgeGradle 5 pins the legacy side to Gradle 7, so they can't share.

name: build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
  pull_request:

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build legacy modules
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-jars
          path: '*/build/libs/*'

  modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew-1.21.1
        run: chmod +x gradlew-1.21.1
      # neoforge-1.21.1's dev run tasks (runGameTestServer, runData, runClient) are known-broken
      # under ModDevGradle 2.0 + NeoForge 21.1.77: BootstrapLauncher JPMS-scans `cats-core_3` on
      # the dev run classpath and the module descriptor computation rejects the
      # `cats.kernel.instances.byte` keyword package. shadowJar fixes it in the shipping jar
      # (relocated to `_byte`), but the dev classpath is separate and can't be diverted cleanly
      # without breaking the build/classes fast-path. See docs/neoforge-1.21.1-cats-integration.md.
      # `build` is the canonical CI check; real-instance smoke testing covers what gametests
      # would cover.
      - name: Build and test 1.21.1 modules
        run: >
          ./gradlew-1.21.1
          :common-1.21.1:build
          :fabric-1.21.1:build
          :neoforge-1.21.1:build
          :neoforge-1.21.1:test
          --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: modern-jars
          path: '*-1.21.1/build/libs/*'
