// fabric-loom and de.lhns.mcdp come from build-1.21.1.gradle's plugins{} block (with
// `apply false`). The stubber stays here since it's only used by this subproject.
buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'de.lolhens:java-mixin-stubber:0.0.2'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'de.lhns.mcdp'
apply plugin: 'scala'
apply plugin: 'maven-publish'

archivesBaseName = parent.project.archives_base_name
version = parent.version + "+fabric-${project.minecraft_version}"
group = parent.group

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

// Pull in shared sources from common-1.21.1. All mixins + Scala co-live under src/main/scala/
// so scalac does joint compilation. The platform module's own java.srcDir is used for the
// mixinstub output only (see below).
sourceSets.main.scala.srcDirs += project(':common-1.21.1').file('src/main/scala')
sourceSets.main.resources.srcDirs += project(':common-1.21.1').file('src/main/resources')

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    // Sonatype Central Portal snapshots repo — hosts the unified `de.lhns.mcdp:mcdp` jar
    // (ADR-0016) at SNAPSHOT versions. The Gradle plugin lives there too; see
    // settings-1.21.1.gradle's pluginManagement.repositories.
    maven {
        name = 'sonatype-central-snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft}:${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // mcdp unified runtime adapter (ADR-0016) — single jar bundles both Fabric and NeoForge
    // adapters; auto-substituted from the composite-included :mcdp project. Provides the
    // `mcdepprovider` LanguageAdapter referenced in fabric.mod.json and the PreLaunchEntrypoint
    // that wires up per-mod URLClassLoaders. Auto Mixin → mod-private bridge codegen
    // (ADR-0018) is on by default — plain Sponge-Common-style mixins call Scala objects
    // directly; the gradle plugin synthesizes the bridge interface + impl + manifest.
    modImplementation "de.lhns.mcdp:mcdp:${project.mcdp_version}"

    // Scala stdlib + circe + cats go through mcdp's per-mod URLClassLoader at runtime.
    // Declared as mcdepImplementation: the plugin walks the transitive closure, emits each
    // library into META-INF/mcdepprovider.toml, and auto-subtracts platform-provided artifacts.
    // Kept compileOnly in :common-1.21.1 since that subproject never produces a jar.
    mcdepImplementation "org.scala-lang:scala3-library_3:${project.scala3_version}"
    mcdepImplementation "io.circe:circe-parser_3:${project.circe_version}"
    mcdepImplementation "io.circe:circe-generic_3:${project.circe_version}"
    mcdepImplementation "io.circe:circe-generic-extras_3:${project.circe_extras_version}"
    mcdepImplementation "io.circe:circe-config_3:${project.circe_config_version}"
    mcdepImplementation "org.typelevel:cats-core_3:${project.cats_version}"
}

mcdepprovider {
    lang.set('scala')
    // Override the auto-derived bridge package: mcdp's default builds it as
    //   <group>.<projectName.replace('-','_')>.mcdp_mixin_bridges
    // which for projectName "fabric-1.21.1" becomes
    //   de.lolhens.fabric_1.21.1.mcdp_mixin_bridges
    // — the dots in the MC version turn "21" / "1" into package segments that aren't
    // valid Java identifiers, blowing up at class-load time with
    //   IllegalArgumentException: Invalid package name: '21' is not a Java identifier.
    // Pin a valid identifier explicitly.
    bridges {
        bridgePackage.set('de.lolhens.minecraft.fluidphysics.fabric.mcdp_bridges')
    }
    // FlowableFluidMixin's class header is `implements FlowableFluidAccessor`, where the
    // accessor is itself a mixin in the same package. ADR-0018 explicitly leaves class-header
    // references unrewritten — the bridge codegen cannot strip the mod-private type from
    // `interfaces[]`. Loading the mixin package parent-first (game-layer classloader) is the
    // documented fix and is safe here: every type under `…fluidphysics.mixin.` is itself a
    // mixin (target/accessor/injector) and only ever referenced from other mixins.
    sharedPackages.add('de.lolhens.minecraft.fluidphysics.mixin.')
}

// java-mixin-stubber
def mixinstubsDir = file("$compileJava.temporaryDir/mixinstubs")
sourceSets.main.java.srcDirs += mixinstubsDir

task mixinstubs {
    doLast {
        delete(mixinstubsDir)
        // Generate stubs from common-1.21.1's Scala sources (the module-local scala srcDirs is empty; sources live in common)
        de.lolhens.jstubber.Stubber.MIXIN.stubDirectory(
            project(':common-1.21.1').file('src/main/scala').toPath(),
            mixinstubsDir.toPath()
        )
    }
}
compileJava.dependsOn(mixinstubs)
compileJava.doLast {
    delete(compileJava.destinationDirectory)
    delete(mixinstubsDir)
}

compileScala.doFirst {
    compileScala.options.compilerArgs += compileJava.options.compilerArgs
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ScalaCompile) {
    scalaCompileOptions.encoding = 'UTF-8'
    scalaCompileOptions.additionalParameters = ['-release', '21']
}

java {
    withSourcesJar()
}

// Mixin source files (.java) live under src/main/scala alongside the Scala code, and the stubber
// also emits .java stubs into mixinstubsDir which is added to java.srcDirs. Both paths find the
// same filenames; keep only one copy in the sources jar.
tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(remapJar) { builtBy remapJar }
            artifact(sourcesJar) { builtBy remapSourcesJar }
        }
    }
    repositories {
        // publish locally if desired
    }
}
